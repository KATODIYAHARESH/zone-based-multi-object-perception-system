# Zone definitions - normalised coordinates (0..1), origin top-left.
# Written by `python main.py zones` (OpenCV editor), the Streamlit editor, or
# exported from the web console (GET /api/zones?format=yaml).
#   mode: allowed    -> `categories` is a whitelist (anything else = violation)
#   mode: restricted -> `categories` is a blacklist (empty list = nothing may enter)
zones:
- id: zone_a
  name: Zone A
  mode: allowed
  categories: [human]
  polygon: [[0.04, 0.52], [0.36, 0.52], [0.40, 0.97], [0.02, 0.97]]
  max_occupancy: 8
  dwell_limit_s: 120
  color: amber
- id: walkway
  name: Pedestrian Walkway
  mode: restricted
  categories: [vehicle]
  polygon: [[0.40, 0.45], [0.58, 0.45], [0.66, 0.98], [0.44, 0.98]]
  color: amber
- id: farm
  name: Farm Zone
  mode: allowed
  categories: [human, animal, vehicle]
  polygon: [[0.66, 0.50], [0.97, 0.50], [0.98, 0.97], [0.70, 0.97]]
  color: green
